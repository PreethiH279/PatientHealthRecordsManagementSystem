<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        .container {
            width: 90%;
            max-width: 600px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            margin-bottom: 15px;
            font-weight: bold;
        }
        .form-group input, .form-group select, .form-group textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
        }
        .form-group input[type="radio"] {
            margin-right: 15px;
        }
        .form-group .radio-group {
            display: flex;
            justify-content: space-around;
        }
        .form-group .radio-group label {
            margin-right: 15px;
        }
        .contact-group input {
            display: flex;
            margin-bottom: 10px;
            margin-right: 10px;
            width: 150px;
        }
        .buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
        .buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            flex: 1;
            margin: 0 5px;
        }
        .buttons button:hover {
            background-color: #0056b3;
        }
        .view-data {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f9f9f9;
        }
        @media (min-width: 768px) {
            .form-group {
                flex-direction: row;
                align-items: center;
            }
            .form-group label {
                flex: 1;
                margin-right: 10px;
            }
            .form-group input, .form-group select, .form-group textarea {
                flex: 2;
            }
            .buttons {
                justify-content: space-between;
            }
            .buttons button {
                flex: unset;
                margin: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Registration Form</h1>
        <form id="registrationForm" action="http://localhost:3000/register" method="POST" enctype="multipart/form-data">
        
            <div class="form-group">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" name="first_name" required>
            </div>
            <div class="form-group">
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" name="last_name" required>
            </div>
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>
            </div>
            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="Male" required> Male</label>
                    <label><input type="radio" name="gender" value="Female"> Female</label>
                    <label><input type="radio" name="gender" value="Other"> Other</label>
                </div>
            </div>
            <div class="form-group">
                <label for="blood_group">Blood Group</label>
                <select id="blood_group" name="blood_group" required>
                    <option value="">Select</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
            </div>
            <div class="form-group">
                <label for="phone_no">Phone Number</label>
                <div class="contact-group">
                    <input type="tel" id="phone_no" name="phone_no" maxlength="10" placeholder="10-digit phone Number" required>
                </div>
            </div>
            <div class="form-group">
                <label for="contact-group">Emergency Contact Numbers</label>
                <div class="contact-group">
                    <input type="tel" id="emergency_contact_1" name="emergency_contact_1" maxlength="10" placeholder="Contact Number 2 " required>
                    <input type="tel" id="emergency_contact_2" name="emergency_contact_2" maxlength="10" placeholder="Contact Number 3 ">
                </div>
            </div>
            <div class="form-group">
                <label for="aadhar_number">Aadhar Number</label>
                <input type="text" id="aadhar_number" maxlength="12" pattern="\d{12}" name="aadhar_number" placeholder="12-digit Aadhar Number" required>
            </div>
            <div class="form-group">
                <label for="pan_number">PAN Number</label>
                <input type="text" id="pan_number" maxlength="10" pattern="[A-Z]{5}\d{4}[A-Z]" placeholder="ABCDE1234F" name="pan_number" required>
            </div>
            <div class="form-group">
                <label for="driving_license">Driving License Number</label>
                <input type="text" id="driving_license" maxlength="15" pattern="[A-Z]{2}\d{13}" name="driving_license" placeholder="AB1234567890123" required>
            </div>
            <div class="form-group">
                <llabel for="occupation">Occupation</label>
                <input type="text" id="occupation" name="occupation">
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Marital Status</label>
                <div class="radio-group">
                    <label><input type="radio" name="marital_status" value="Single" required> Single</label>
                    <label><input type="radio" name="marital_status" value="Married"> Married</label>
                    <label><input type="radio" name="marital_status" value="Divorced"> Divorced</label>
                </div>
            </div>
            <div class="form-group">
                <label>Diabetes</label>
                <div class="radio-group">
                    <label><input type="radio" name="diabetes" value="Yes" required> Yes</label>
                    <label><input type="radio" name="diabetes" value="No"> No</label>
                </div>
            </div>
            <div class="form-group">
                <label>Blood Pressure</label>
                <div class="radio-group">
                    <label><input type="radio" name="blood_pressure" value="Yes" required> Yes</label>
                    <label><input type="radio" name="blood_pressure" value="No"> No</label>
                </div>
            </div>
            <div class="form-group">
                <label for="photo">Photo Upload (Max size: 5MB)</label>
                <input type="file" id="photo" name="photo" accept="image/*" required>
            </div>
            <div class="buttons">
                <button type="button" onclick="editForm()">Edit</button>
                <button type="submit">Submit</button>
                <button type="button" onclick="viewData()">View</button>
            </div>
        </form>

        <div id="viewData" class="view-data" style="display: none;"></div>
    </div>

    <script>
        const form = document.getElementById('registrationForm');
        const viewDataDiv = document.getElementById('viewData');

        

        form.addEventListener('submit', function (e) {
            e.preventDefault();
});

        function editForm() {
            alert('You can now edit the form.');
        }

        function viewData() {
            const formData = new FormData(form);
            let output = '<h2>Submitted Data</h2><ul>';
            for (let [key, value] of formData.entries()) {
                output += <li><strong>${key} : </strong> ${value}</li>;
            }
            output += '</ul>';
            viewDataDiv.innerHTML = output;
            viewDataDiv.style.display = 'block';
        }
    </script>
</body>
</html>
